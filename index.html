const DIA=[['CALLIE','Nobody crosses after dark. You know that.'],['FERRYMAN','I know what the parish says. The river never said a word about it to me, and I have listened to it longer than any of them.']];
function dialogue(style){
  if(style==='ok')return DIA.map(([n,t],i)=>`<p class="spk">${n}. ${t}${i===DIA.length-1?' (2.1)':''}</p>`).join('');

  return `<p class="runin">${DIA.map(([n,t])=>`${n.charAt(0)+n.slice(1).toLowerCase()} says, “${t}”`).join(' ')} (2.1).</p>`;
}

/* ---------- Passages ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function slots(ex){return ex.parts.filter(p=>typeof p!=='string')}
function passage(ex,ch,mode,res){
  return ex.parts.map(p=>{
    if(typeof p==='string')return p;
    const i=mode==='key'?p.key[0]:ch[p.id];
    if(mode==='key')return p.opts[i].h;
    const st=res?(res.bad.has(p.id)?' bad':' good'):'';
    const op=S_.open===p.id?' open':'';
    if(p.block)return `<div class="bslot${i!=null?' set':''}${st}${op}" data-slot="${p.id}" role="button" tabindex="0" aria-label="${esc(p.label)}">${i!=null?p.opts[i].h:'<span class="slot empty">Choose how to set the quotation</span>'}</div>`;
    const tiny=p.opts.every(o=>o.h.length<=2)?' tiny':'';
    return i!=null?`<span class="slot${tiny}${st}${op}" data-slot="${p.id}" role="button" tabindex="0" aria-label="${esc(p.label)}">${p.opts[i].h||'&#8203;&nbsp;'}</span>`:`<span class="slot empty${op}" data-slot="${p.id}" role="button" tabindex="0">choose ${esc(p.label.toLowerCase())}</span>`;
  }).join('');
}
function check(ex,ch){
  const errs=[],bad=new Set();
  slots(ex).forEach(p=>{const i=ch[p.id];
    if(i==null){errs.push({h:p.label+': not chosen',b:'Tap the marked spot in the passage and choose a form.'});bad.add(p.id);return}
    if(!p.key.includes(i)){errs.push({h:p.label,b:p.opts[i].n||'Choose a different form.'});bad.add(p.id)}});
  return{errs,bad};
}
function checkPage(ex,st){const errs=[];ex.ctl.forEach(c=>{if(!c.key.includes(st[c.id]))errs.push({h:c.label+': '+c.opts[st[c.id]].replace(/<[^>]+>/g,''),b:c.note})});return{errs}}

  const sz=[11,12,14][st.size]/12;
  const lh=[1.08,1,2,2,2][st.spacing],after=[8,0,8,0,0][st.spacing]/12;
  const base=`font-family:${fam};font-size:${sz}em;line-height:${lh};`;
  const pafter=`margin-bottom:${after*sz}em;`;
  const head=[['Ana Lindqvist','Professor Marsden','ENGL 1302','14 October 2026'],['Ana Lindqvist','ENGL 1302','Professor Marsden','14 October 2026'],['14 October 2026','Ana Lindqvist','Professor Marsden','ENGL 1302'],null][st.heading];
  const nov=st.tital===0?'<i>The Turn of the Screw</i>':'The Turn of the Screw';
  const tstyle=['text-align:center;','text-align:center;font-weight:700;','text-align:center;text-decoration:underline;','text-align:center;text-transform:uppercase;','text-align:left;'][st.title];
  const ttext=`Candlelight and Doubt in ${nov}`;
  const ind=['text-indent:.5in;','text-indent:0;','text-indent:2.5ch;','text-indent:0;'][st.indent];

  const al=st.align?'text-align:justify;':'text-align:left;';
  const rh=['<span>1</span>','Lindqvist 1','Lindqvist p. 1','Lindqvist - 1',''][st.rh];
  const rhs=st.rhfont===0?base.replace(/line-height:[^;]+;/,''):'font-family:"Aptos","Segoe UI",system-ui,sans-serif;font-size:.92em;';
  const body=['The governess in Henry James’s novella sees by candlelight, and the candle decides what she can know. Brandt argues that the light “frames the ghost before the ghost appears” (41), so that every apparition arrives already lit for her.','What the governess cannot see matters as much. The dark corners of Bly are not empty; they are simply the places her light has not reached, and James leaves the reader standing in them with her.'];
  return `<div class="pagewrap"><div class="sheet">${rh?`<div class="rh" style="${rhs}">${rh}</div>`:''}<div style="${base}">${head?head.map(l=>`<p style="${pafter}">${l}</p>`).join(''):'<p style="'+pafter+'color:#999;font-style:italic">[title page]</p>'}<p style="${tstyle}${pafter}">${ttext}</p>${body.map(t=>`<p style="${ind}${al}${pafter}${gap}">${t}</p>`).join('')}</div></div></div>`;

/* ---------- Guide ---------- */
const GWC={ashby:'Ashby, Theodora. <i>The Cotton Gin and the Ghost: Haunted Industry in the Old South</i>. Pecan Bayou UP, 2018.',mercer:'Mercer, Paul, and Hana Ito. <i>Reading the American Frontier</i>. 2nd ed., Longleaf Press, 2020.',quint:'Quintero, Elena, et al. <i>Swamp Lights: Folklore of the Gulf Coast</i>. U of Sabine P, 2015.',ghost:'“Ten Ghost Lights of the Gulf Coast.” <i>Coastal Lore</i>, 3 Mar. 2023, www.coastallore.org/ghost-lights.',widow:'<i>The Widow’s Lantern</i>. Directed by Owen Hale, Bayou Pictures, 1958.'};
const gx=(label,p,wc)=>`<div class="gex"><div class="label">${label}</div><p class="p">${p}</p>${wc?`<p class="wc">${wc}</p>`:''}</div>`;
const GUIDE=[
 {t:'Pointers',b:()=>`<p>An in-text citation is a <b>pointer</b>. It sends the reader to one entry in your Works Cited list and to the exact place in that source. So it holds two things: the first word of the works-cited entry, and a location, such as a page.</p>
  ${gx('A citation and the entry it points to','Cotton mills, Ashby argues, were “the first haunted factories in America” (<mark>Ashby</mark> 112).',GWC.ashby.replace('Ashby,','<mark>Ashby</mark>,'))}
  <p>Whatever the entry begins with is what the citation uses: an author’s last name, or a title when there is no author.</p>
  <p class="hint">The examples in this guide come from invented sources, different from the ones in the exercises.</p>`},
 {t:'Author and page',b:()=>`<p>The basic citation is the author’s last name and the page number, with nothing between them. The period of your sentence goes after the parentheses.</p>
  ${gx('Author in the parentheses','The mills ran “through every hour of the night” (Ashby 114).')}
  ${gx('Author in your sentence','Ashby notes that the mills ran “through every hour of the night” (114).')}
  <h4>Watch for</h4><ul><li>No comma between author and page, and no “p.” or “page.”</li><li>The last name only.</li><li>If your sentence names the author, the parentheses hold only the page.</li><li>Once a paragraph has named its source, later citations to it need only the page, until another source comes between. Then name the first source again.</li></ul>
  ${gx('Carrying a source forward','Ashby calls the mills “the first haunted factories in America” (112) and the night shift “a congregation of the sleepless” (33). Mercer and Ito disagree (45), but the shifts ran “through every hour of the night” (Ashby 114).')}`},
 {t:'Names',b:()=>`<ul><li>Give a person’s full name the first time you mention them in your sentences, and the surname alone after that: Theodora Ashby, then Ashby.</li><li>If the name first appears in a citation, use the full name the first time you mention the person in a sentence.</li><li>If two people share a surname, use full names in your sentences whenever a reader could mix them up, and add the first initial in citations: (T. Ashby 40).</li><li>Characters in a work may be called what the work calls them, after their first full mention. ${CR}</li></ul>
  ${gx('First mention, then after','Theodora Ashby spent years in mill archives. Ashby found that the night shift ran without a break for decades.')}`},
 {t:'More than one author',b:()=>`${gx('Two authors: both names, joined by “and”','Frontier diaries “record weather more faithfully than feeling” (Mercer and Ito 45).',GWC.mercer)}
  ${gx('Three or more: the first name and et al.','Ghost lights were reported “in every parish with a marsh” (Quintero et al. 9).',GWC.quint)}
  ${gx('Two sources for one point: a semicolon between them','Both books treat folklore as evidence (Mercer and Ito 12; Quintero et al. 30).')}`},
 {t:'Titles as pointers',b:()=>`<p>When an entry begins with a title, the citation uses the title, shortened, and styled the same way.</p>
  ${gx('No author: a shortened title, in quotation marks for a web page','Fishermen still report “a green light that walks” (“Ten Ghost Lights”).',GWC.ghost)}
  ${gx('A film whose entry begins with its title, located by time','The lantern first appears in the window at dusk (<i>Widow’s Lantern</i> 01:12:40-01:13:05).',GWC.widow)}
  ${gx('Two works by one author: a short title says which','Ashby calls the night shift “a congregation of the sleepless” (<i>Cotton Gin</i> 33).')}
  <h4>Watch for</h4><ul><li>Web pages have no page numbers. Don’t invent one.</li><li>Point to the director only when the entry begins with the director.</li><li>Words you found quoted in a source are cited with <b>qtd. in</b>: (qtd. in Ashby 40).</li></ul>`},
 {t:'Punctuation around quotations',b:()=>`<ul><li>Periods and commas go <b>after</b> the citation.</li><li>With no citation after the quotation, a period or comma goes <b>inside</b> the closing quotation marks. Colons and semicolons always go outside.</li><li>A question mark or exclamation point that belongs to the quotation stays inside the quotation marks, and your period follows the citation.</li><li>A question mark that belongs to your sentence goes after the citation.</li></ul>
  ${gx('The quotation asks the question','Ashby asks, “Who keeps a mill running at midnight?” (90).')}
  ${gx('You ask the question','Did the mills really run “through every hour of the night” (Ashby 114)?')}`},
 {t:'Poems and plays',b:()=>`<ul><li>Mark line breaks with a slash, with a space on each side; a stanza break takes a double slash.</li><li>Cite line numbers, not pages. The first citation says “lines”; after that, the numbers alone.</li><li>Cite a verse play by act, scene, and line, in arabic numerals separated by periods.</li></ul>
  ${gx('Two lines of a poem','The speaker hears the marsh “calling low / Across the water” (lines 3-4).')}
  ${gx('A verse play','The king’s boast, “I hold the tide as other men hold land,” is answered by the river itself (3.2.14).')}`},
 {t:'Block quotations',b:()=>`<p>Prose longer than four lines, or verse longer than three, is set off as a <b>block</b>:</p><ul><li>Start it on a new line, indented half an inch.</li><li>Keep double spacing. Use no quotation marks.</li><li>Put the citation after the final period.</li><li>For dialogue from a play, start each speech with the speaker’s name in capitals and a period, and indent the rest of the speech further.</li></ul>
  <div class="gex"><div class="label">A block quotation</div><div class="paper" style="box-shadow:none;padding:8px 4px"><p style="text-indent:0">Ashby describes the night shift:</p><p class="bq">The bell rang at ten and again at two, and between the bells the room belonged to the machines. The workers learned to speak in signs, because no voice could carry over the looms, and some of them went on speaking that way at home, years after the mill had closed. (115)</p></div></div>`},
 {t:'Changing a quotation',b:()=>`<ul><li>Mark words you leave out with an ellipsis: three periods with a space before each and a space after the last ( . . . ).</li><li>Use an ellipsis only where the omission isn’t obvious. A fragment worked into your sentence needs none at the start or the end.</li><li>Word’s AutoCorrect turns typed periods into a single ellipsis character (…). Undo it or turn off that AutoCorrect option.</li><li>Words you add go in square brackets.</li></ul>
  ${gx('An omission','The mills were “a congregation . . . of the sleepless” (Ashby 33).')}
  ${gx('An addition','Ashby writes that “[the foreman] never once slept in the house” (61).')}`},
 {t:'Titles in your sentences',b:()=>`<p>Titles in your own sentences follow the same rules as in the Works Cited list: italics for works that stand alone (books, films, journals, albums), quotation marks for works inside something larger (essays, stories, poems, articles, episodes, songs). A title inside a quoted title keeps its own styling.</p>
  ${gx('Three kinds of title','In <i>Swamp Lights</i>, the essay “Green Fire on the Bayou” compares the lights to those in Poe’s “The City in the Sea.”')}`},
 {t:'Quoting well',b:()=>`<p>Citation tells the reader where words came from. Quoting well decides which words, and what you do with them.</p>
  <h4>Why quote</h4><ul><li>To present textual evidence you will analyze.</li><li>To bring in the support of earlier arguments, or to set out a position you will answer.</li><li>To give the reader the voice or style of an author or character.</li></ul>
  <h4>When to paraphrase instead</h4><ul><li>When the gist matters and the exact wording doesn’t.</li><li>When the original would be needlessly hard for your reader, or would take a lot of grammatical tailoring.</li><li>When you need to keep your own voice in charge.</li></ul>
  <h4>Failures of quotation</h4><ul><li><b>Plagiarism:</b> borrowing without attribution.</li><li><b>Floating quotation:</b> borrowing without incorporation. Every quotation rides in a sentence of yours.</li><li><b>Misquotation:</b> borrowing without care. Everything in quotation marks must be exactly as written.</li><li><b>Thin quotation:</b> borrowing without context. Say who wrote it, in what work, who is speaking, about whom, and why it matters to you.</li><li><b>Misuse:</b> borrowing without understanding, so the quotation doesn’t prove what you claim.</li><li><b>Frankensteining:</b> borrowing without an argument, so the essay is all quotation except for the stitches.</li></ul>
  <h4>Introducing a quotation ${CR}</h4><ul><li>A colon after a complete sentence: Ashby’s point is simple: “…”</li><li>A comma after a verb of saying: Ashby writes, “…”</li><li>Nothing at all when the quotation runs on in your own sentence: Ashby argues that “…”</li></ul>
  <h4>Precise verbs</h4><p>“Writes” and “says” wear thin. Choose the verb that says what the source is doing: argues, asserts, suggests, proposes, concedes, admits, denies, questions, refutes, demonstrates, observes, reports, emphasizes.</p>`},
 {t:'The first page',b:()=>`<ul><li>No title page. At top left, on four double-spaced lines: your name, your instructor’s name, the course, and the date.</li><li>The title, centered, in plain type: no bold, underlining, italics, quotation marks, or all capitals. Titles of other works inside it are styled as usual.</li><li>At top right of every page, half an inch from the top: your last name, a space, and the page number, in the same typeface as the text.</li><li>Double-space everything, with no extra space after paragraphs. Word’s defaults (1.08 lines and 8 points after each paragraph) do not.</li><li>One-inch margins. Indent paragraphs half an inch with Tab. Leave the right margin ragged.</li><li>A readable typeface whose italics stand out, at 12 points. ${COURSE.on?`In this course: ${COURSE.font}, ${COURSE.size}. ${CR}`:''}</li></ul>
  <div class="actions" style="margin-top:12px"><button class="btn" data-go="0">Start practicing</button></div>`}
];

/* ---------- Completion slip (same scheme as Core Elements, its own phrase) ---------- */
const SALT='ferrymans-wake-2-1-lines-166-67';
const MON=['Jan.','Feb.','Mar.','Apr.','May','June','July','Aug.','Sept.','Oct.','Nov.','Dec.'];
function today(){const d=new Date();return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function normName(n){return String(n).trim().replace(/\s+/g,' ').toLowerCase()}
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function slipCode(name,n,total,date){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x=cyrb53(SALT+'|'+normName(name)+'|'+n+'/'+total+'|'+date.trim(),11),s='';for(let i=0;i<8;i++){s+=A[x%32];x=Math.floor(x/32)}return s.slice(0,4)+'-'+s.slice(4)}
function slipLine(name){const n=S_.done.size,t=EX.length,d=today();return `Pointers · ${name.trim()} · ${n}/${t} · ${d} · ${slipCode(name,n,t,d)}`}
function slipHTML(){
  const n=S_.done.size,t=EX.length;
  return `<div class="grid" style="margin-top:18px"><section class="prose"><span class="label">Your progress</span><h2 style="font-family:var(--f-book);font-weight:400;margin:4px 0 10px">${n} of ${t} exercises correct</h2><p>An exercise counts once you get it right, however many tries it takes. Progress is saved in this browser on this device, so finish on the same device you started on.</p><ol style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px">${EX.map((e,i)=>`<li style="display:flex;gap:8px;align-items:baseline"><span style="font-family:var(--f-type);color:${S_.done.has(i)?'var(--ok)':'var(--muted)'}">${S_.done.has(i)?'✓':'·'}</span><button class="linkbtn" data-go="${i}">${i+1}. ${e.name}</button></li>`).join('')}</ol></section>
  <section class="panel"><div><label class="label" for="stuName">Your name, as it appears in D2L</label><input id="stuName" value="${esc(S_.name)}" autocomplete="name" style="margin-top:6px"></div>
  <div><div class="label">Your slip</div><div class="slipbox" id="slipText" style="margin-top:6px">${S_.name.trim()?esc(slipLine(S_.name)):'Type your name to make your slip.'}</div></div>
  <div class="actions"><button class="btn" id="copySlip">Copy the slip</button></div><p class="hint" id="copyMsg">Paste the whole line into the D2L assignment. Don’t edit it: any change breaks the code.</p></section></div>`;
}
function verifyHTML(){return `<div class="prose" style="margin-top:18px"><span class="label">For the instructor</span><h2 style="font-family:var(--f-book);font-weight:400;margin:4px 0 10px">Check completion slips</h2><p>Paste one slip or a whole column of them.</p><textarea id="verifyIn" rows="8">${esc(S_.vin||'')}</textarea><div class="actions" style="margin:10px 0"><button class="btn" id="verifyGo">Check slips</button></div><div>${S_.vout||''}</div></div>`}
function verifySlips(text){const re=/Pointers\s*[·•|]\s*(.+?)\s*[·•|]\s*(\d+)\s*\/\s*(\d+)\s*[·•|]\s*(.+?)\s*[·•|]\s*([A-Z0-9]{4}-[A-Z0-9]{4})/gi;const rows=[];let m;
  while((m=re.exec(text))){const [,name,n,t,date,code]=m;rows.push({name,n:+n,t:+t,date,ok:slipCode(name,+n,+t,date)===code.toUpperCase()})}
  if(!rows.length)return '<p>No slips found. A slip looks like: Pointers · Name · 27/27 · 14 Oct. 2026 · ABCD-EFGH</p>';
  return '<ul class="corr">'+rows.map(r=>`<li style="border-left-color:${r.ok?'var(--ok)':'var(--stamp)'}"><b style="color:${r.ok?'var(--ok)':'var(--stamp)'}">${r.ok?'Valid':'Does not match'}</b>${esc(r.name)} · ${r.n}/${r.t}${r.ok&&r.t!==EX.length?' (made with an older set of '+r.t+' exercises)':''}${r.ok&&r.n<r.t?' · not finished':''} · ${esc(r.date)}</li>`).join('')+'</ul>'}

  const t=ev.target.closest('button,[data-slot]');if(!t)return;
  const ex=EX[S_.ex],ch=S_.ch[S_.ex];
  if(t.id==='vGuide'){S_.view='guide';return render()}
  if(t.id==='vBench'){S_.view='bench';return render()}
  if(t.id==='vSlip'){S_.view='slip';return render()}
  if(t.dataset.gs!=null){S_.g=Math.max(0,Math.min(GUIDE.length-1,+t.dataset.gs));render();scrollTo({top:0});return}
  if(t.dataset.go!=null){S_.ex=+t.dataset.go;S_.view='bench';S_.open=null;clearRes();render();scrollTo({top:0});return}
  if(t.id==='next'){S_.ex++;S_.open=null;clearRes();render();scrollTo({top:0});return}
  if(t.id==='reset'){S_.ch[S_.ex]=ex.kind==='page'?{...ex.start}:{};S_.open=null;clearRes();return render()}
  if(t.dataset.slot){S_.open=S_.open===t.dataset.slot?null:t.dataset.slot;return render()}
  if(t.dataset.opt!=null&&S_.open){ch[S_.open]=+t.dataset.opt;const ss=slots(ex);const nx=ss.find(p=>ch[p.id]==null);S_.open=nx?nx.id:null;clearRes();return render()}
  if(t.dataset.pg){ch[t.dataset.pg]=+t.dataset.v;clearRes();return render()}
  if(t.id==='check'){S_.res=ex.kind==='page'?checkPage(ex,ch):check(ex,ch);S_.open=null;S_.showKey=false;if(!S_.res.errs.length){S_.done.add(S_.ex);save()}return render()}
  if(t.id==='showkey'){S_.showKey=true;return render()}
  if(t.id==='copySlip'){const txt=S_.name.trim()?slipLine(S_.name):'';const msg=$('#copyMsg');if(!txt){msg.textContent='Type your name first.';return}
    const sel=()=>{const r=document.createRange();r.selectNodeContents($('#slipText'));const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent='Selected. Copy it with your device’s Copy command.'};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent='Copied. Paste it into the D2L assignment.'},sel)}catch(e){sel()}return}
  if(t.id==='verifyGo'){S_.vin=$('#verifyIn').value;S_.vout=verifySlips(S_.vin);return render()}
});
document.addEventListener('keydown',ev=>{const t=ev.target;if(t.dataset&&t.dataset.slot&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();t.click()}});
document.addEventListener('input',ev=>{if(ev.target.id==='stuName'){S_.name=ev.target.value;save();const el=$('#slipText');if(el)el.textContent=S_.name.trim()?slipLine(S_.name):'Type your name to make your slip.'}});
window.addEventListener('hashchange',()=>{route();render()});
route();render();
</script>
